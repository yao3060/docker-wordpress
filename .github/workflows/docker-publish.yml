name: Build and Push Docker Images

on:
  push:
    branches:
      - wordpress-php-8.4-frankenphp
    paths:
      - 'wordpress-php-8.4-frankenphp/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push (yao3060/wordpress:php8.4-frankenphp)
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: yao3060/wordpress
      TAG: php8.4-frankenphp
      CONTEXT: wordpress-php-8.4-frankenphp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.CONTEXT }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          provenance: false
